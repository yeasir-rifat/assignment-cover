  <!-- Theme init must run before first paint to avoid a light/dark flash -->

(function(){
  var K='coverx_theme', t=null;
  try { t=localStorage.getItem(K); } catch(e){}
  if(t!=='dark' && t!=='light'){ t=(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'; }
  document.documentElement.setAttribute('data-theme',t);
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('themeBtn'); if(!b) return;
    b.addEventListener('click',function(){
      var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';

      try{ localStorage.setItem(K,n); }catch(e){}
    });
  });
})();
</script>

        <button type="button" class="btn-ghost" id="newAssignmentBtn" title="Clears title, course and teachers, keeps your student info"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8z"/><path d="M14 3v3.5A1.5 1.5 0 0 0 15.5 8H19"/><path d="M12 11.5v5M9.5 14h5"/></svg><span class="btn-label">New Assignment</span></button>
        <button type="button" class="btn-ghost danger" id="clearAllBtn" title="Clears every field"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4.5h6V7"/><path d="M6.5 7l.8 12a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/><path d="M10 11v6M14 11v6"/></svg><span class="btn-label">Clear All</span></button>
      </div>

    </div><!-- /form-body -->

  <!-- RIGHT — Preview -->
  <main class="right-panel" id="rightPanel">
    <div class="preview-empty" id="previewEmpty">
      <svg aria-hidden="true" focusable="false" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.4" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

      <button type="button" class="bg-arrow js-bg-prev" title="Previous background" aria-label="Previous background"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>

      </div>
      <button type="button" class="bg-arrow js-bg-next" title="Next background" aria-label="Next background"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="preview-dock" id="previewDock">
    <div class="zoom-row" id="zoomRow">
      <button type="button" class="bg-arrow bg-arrow-m js-bg-prev" title="Previous background" aria-label="Previous background"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
    <div class="zoom-bar" id="zoomBar" role="group" aria-label="Zoom">
      <button type="button" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button type="button" id="zoomResetBtn" class="zoom-val" title="Reset zoom" aria-label="Reset zoom">100%</button>
      <button type="button" id="zoomInBtn" title="Zoom in" aria-label="Zoom in"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    </div>
      <button type="button" class="bg-arrow bg-arrow-m js-bg-next" title="Next background" aria-label="Next background"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <div class="bg-thumbs" id="bgThumbs" aria-label="Background previews"></div>
    </div>
    <div class="mobile-actions">
      <button class="btn-download-mobile" id="downloadBtnMobile" type="button" onclick="generateAndDownload()">
        <svg aria-hidden="true" focusable="false" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>Download</span>
      </button>
    </div>
  </main>

</div>
